<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdScreen Sports · Broadcast Pro</title>
<!--
  AdScreen Sports — Broadcast Pro: gráficos de TV para OBS / vMix (Fuente de navegador, 1920×1080, fondo transparente).
  Solo lectura: escucha el mismo WebSocket que las pantallas y nunca manda comandos.
  ?preview=1  → muestra lo PREPARADO (Preview).  Sin parámetro → lo que está AL AIRE (Program).
  Los relojes salen del servidor (mensajes "clock" cada 100 ms); aquí solo se dibuja lo recibido, sin cronómetros propios.
-->
<style>
  @font-face { font-family: 'Barlow Condensed'; src: url(/fonts/barlow-condensed-500.woff2) format('woff2'); font-weight: 500; font-display: block; }
  @font-face { font-family: 'Barlow Condensed'; src: url(/fonts/barlow-condensed-600.woff2) format('woff2'); font-weight: 600; font-display: block; }
  @font-face { font-family: 'Barlow Condensed'; src: url(/fonts/barlow-condensed-700.woff2) format('woff2'); font-weight: 700; font-display: block; }
  @font-face { font-family: 'Barlow Condensed'; src: url(/fonts/barlow-condensed-800.woff2) format('woff2'); font-weight: 800; font-display: block; }

  :root { --home: #c8102e; --away: #1d4ed8; --accent: #f5b301; --panel: #0b1020; --panelA: rgba(11,16,32,.94); --text: #fff; --ink: #0b1020; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* lienzo de diseño 1920×1080; se escala a la ventana (otras resoluciones) sin deformarse */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; color: var(--text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  /* ================= SCOREBUG (capa propia) ================= */
  #bug { position: absolute; transform-origin: var(--bo, 50% 100%); }
  #bug .in { position: relative; display: flex; align-items: stretch; height: 80px; filter: drop-shadow(0 10px 28px rgba(0,0,0,.45));
    opacity: 0; transform: translateY(26px); transition: opacity .35s ease, transform .5s cubic-bezier(.2,.85,.25,1); }
  #bug.top .in { transform: translateY(-26px); }
  #bug.on .in { opacity: 1; transform: none; }
  .brand { width: 84px; background: var(--accent); color: var(--ink); display: flex; flex-direction: column; justify-content: center; align-items: center;
    clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%); padding-left: 10px; line-height: .86; text-align: center; }
  .brand small { font-weight: 700; font-size: 13px; letter-spacing: .12em; }
  .brand b { font-weight: 800; font-size: 22px; letter-spacing: .04em; }
  .noBrand .brand { display: none; }
  .tm { position: relative; width: 384px; display: grid; grid-template-columns: 72px 1fr 98px; grid-template-rows: 58px 22px; margin-right: 2px;
    background: linear-gradient(100deg, rgba(255,255,255,.10), rgba(0,0,0,.30) 70%), var(--c); }
  .tm.home { --c: var(--home); } .tm.away { --c: var(--away); }
  .tm .lg { grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.16); }
  .tm .lg img { max-width: 56px; max-height: 56px; object-fit: contain; }
  .tm .lg .ph { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; }
  .noLogos .tm { grid-template-columns: 0 1fr 98px; } .noLogos .tm .lg { display: none; }
  .tm .nm { display: flex; align-items: center; padding: 0 14px; font-weight: 800; font-size: 38px; letter-spacing: .03em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .tm .nm.long { font-size: 28px; letter-spacing: .01em; }
  .tm .sub { grid-column: 2; display: flex; align-items: center; gap: 8px; padding: 0 12px; white-space: nowrap; background: rgba(0,0,0,.30); font-weight: 600; font-size: 15px; letter-spacing: .08em; }
  .noLogos .tm .sub { grid-column: 1 / 3; }
  .tm .pips { display: flex; gap: 4px; } .tm .pips i { width: 12px; height: 4px; background: rgba(255,255,255,.9); border-radius: 1px; }
  .noTO .tm .pips { display: none; }
  .tm .fl { margin-left: auto; opacity: .9; } .noFouls .tm .fl { display: none; }
  .tm .bon { background: var(--accent); color: var(--ink); font-weight: 800; padding: 0 6px; border-radius: 2px; letter-spacing: .1em; display: none; }
  .tm .bon.on { display: inline-block; } .noBonus .tm .bon.on { display: none; }
  .tm .sc { grid-column: 3; grid-row: 1 / 3; display: flex; align-items: center; justify-content: center; background: var(--panel); font-weight: 800; font-size: 60px; line-height: 1; }
  .tm .sc span { display: inline-block; }
  .tm .sc span.pop { animation: pop .55s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { 0% { transform: scale(1); color: var(--accent); } 35% { transform: scale(1.22); color: var(--accent); } 100% { transform: scale(1); color: var(--text); } }
  .tm .poss { position: absolute; left: 0; right: 0; top: -6px; height: 5px; background: var(--accent); opacity: 0; transform: scaleX(.3); transition: opacity .3s, transform .35s; }
  .tm .poss.on { opacity: 1; transform: none; } .noPoss .tm .poss { display: none; }
  .gm { display: grid; grid-template-columns: 82px 150px 78px; background: var(--panel); clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); padding-right: 12px; }
  .noShot .gm { grid-template-columns: 82px 150px 0; }
  .gm > div { display: flex; align-items: center; justify-content: center; }
  .gm .per { color: var(--accent); font-weight: 800; font-size: 30px; letter-spacing: .04em; border-right: 1px solid rgba(255,255,255,.12); }
  .gm .per.fin { font-size: 26px; }
  .gm .clk { font-weight: 800; font-size: 54px; letter-spacing: .01em; }
  .gm .sh { margin: 12px 0 12px 6px; background: rgba(255,255,255,.08); color: var(--accent); font-weight: 800; font-size: 38px; border-radius: 3px; }
  .gm .sh.low { color: #ff4d4d; } .gm .sh.off { visibility: hidden; } .noShot .gm .sh { display: none; }
  /* aviso: tiempo fuera / descanso / final, pegado al scorebug */
  #bug .alert { position: absolute; right: 18px; bottom: 100%; margin-bottom: 7px; display: flex; gap: 12px; align-items: center; padding: 3px 16px;
    background: var(--accent); color: var(--ink); font-weight: 800; font-size: 24px; letter-spacing: .08em; text-transform: uppercase;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); opacity: 0; transform: translateY(12px); transition: opacity .3s, transform .35s; }
  #bug.top .alert { bottom: auto; top: 100%; margin: 7px 0 0; transform: translateY(-12px); }
  #bug .alert.on { opacity: 1; transform: none; }
  #bug .alert .t { font-variant-numeric: tabular-nums; }

  /* ================= GRÁFICOS (cada uno con su entrada y salida) ================= */
  #gfx { position: absolute; inset: 0; transform-origin: 50% 100%; pointer-events: none; }
  .g { position: absolute; visibility: hidden; }
  .g.on, .g.out { visibility: visible; }
  .shell { background: var(--panelA); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .gt { display: flex; align-items: center; justify-content: center; gap: 12px; height: 46px; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 26px; letter-spacing: .14em; }
  .gt small { font-weight: 700; font-size: 15px; letter-spacing: .2em; opacity: .75; }
  .teamsRow { display: grid; grid-template-columns: 1fr 240px 1fr; height: 64px; }
  .teamsRow > div { display: flex; align-items: center; gap: 12px; padding: 0 20px; font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: .03em;
    background: linear-gradient(100deg, rgba(255,255,255,.1), rgba(0,0,0,.28)), var(--c); white-space: nowrap; overflow: hidden; }
  .teamsRow .h { --c: var(--home); } .teamsRow .a { --c: var(--away); justify-content: flex-end; }
  .teamsRow .mid { background: var(--panel); justify-content: center; font-size: 20px; letter-spacing: .2em; color: rgba(255,255,255,.6); }
  .teamsRow img { height: 44px; max-width: 64px; object-fit: contain; }
  .row { display: grid; grid-template-columns: 1fr 240px 1fr; height: 52px; border-top: 1px solid rgba(255,255,255,.08); }
  .row .lab { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; letter-spacing: .14em; color: rgba(255,255,255,.72); text-transform: uppercase; }
  .side { position: relative; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  .side.a { flex-direction: row-reverse; }
  .side .v { position: relative; z-index: 1; font-weight: 800; font-size: 32px; min-width: 64px; }
  .side.a .v { text-align: right; }
  .side .v small { font-weight: 600; font-size: 18px; opacity: .7; margin-left: 8px; }
  .side .v.lead { color: var(--accent); }
  .side .bar { position: absolute; top: 14px; bottom: 14px; width: 0; transition: width .7s cubic-bezier(.2,.8,.2,1); opacity: .45; }
  .side.h .bar { right: 0; background: linear-gradient(270deg, var(--home), rgba(0,0,0,0)); }
  .side.a .bar { left: 0; background: linear-gradient(90deg, var(--away), rgba(0,0,0,0)); }
  .side .who { font-weight: 700; font-size: 28px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .who em { font-style: normal; color: var(--accent); margin-right: 8px; }
  .g .row { opacity: 0; transform: translateY(10px); transition: opacity .25s ease, transform .3s ease; }
  .g.on .row { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 45ms + 180ms); }
  .foot { height: 6px; background: linear-gradient(90deg, var(--home), var(--accent), var(--away)); }

  /* comparativa: sube desde abajo */
  #g-compare { left: 440px; width: 1040px; bottom: var(--gb); opacity: 0; transform: translateY(40px); transition: opacity .3s ease, transform .45s cubic-bezier(.2,.85,.25,1); }
  #g-compare.on { opacity: 1; transform: none; }
  /* líderes: entra desde la derecha */
  #g-leaders { left: 440px; width: 1040px; bottom: var(--gb); opacity: 0; transform: translateX(80px); transition: opacity .3s ease, transform .5s cubic-bezier(.2,.85,.25,1); }
  #g-leaders.on { opacity: 1; transform: none; }
  /* marcador por periodos: crece desde el centro */
  #g-lines { left: 50%; bottom: var(--gb); opacity: 0; transform: translateX(-50%) scale(.92); transition: opacity .3s ease, transform .45s cubic-bezier(.2,.85,.25,1.15); }
  #g-lines.on { opacity: 1; transform: translateX(-50%); }
  #g-lines table { border-collapse: collapse; }
  #g-lines td, #g-lines th { height: 54px; min-width: 78px; text-align: center; font-weight: 800; font-size: 32px; padding: 0 6px; border-top: 1px solid rgba(255,255,255,.08); }
  #g-lines th { height: 36px; font-weight: 700; font-size: 18px; letter-spacing: .14em; color: rgba(255,255,255,.65); border: 0; }
  #g-lines td.tn { min-width: 250px; text-align: left; padding: 0 18px; font-size: 32px; text-transform: uppercase; background: linear-gradient(100deg, rgba(255,255,255,.1), rgba(0,0,0,.28)), var(--c); }
  #g-lines td.tot { min-width: 100px; background: rgba(255,255,255,.07); color: var(--accent); font-size: 38px; }
  #g-lines td.fut { color: rgba(255,255,255,.25); }
  /* ficha de jugador: se abre como cortina desde la izquierda */
  #g-player { left: var(--px); bottom: var(--pb); width: 900px; display: flex; height: 156px; filter: drop-shadow(0 16px 40px rgba(0,0,0,.45));
    clip-path: inset(0 100% 0 0); transition: clip-path .4s cubic-bezier(.6,0,.4,1); }
  #g-player.on { clip-path: inset(0 0 0 0); transition: clip-path .6s cubic-bezier(.2,.85,.25,1); }
  #g-player .no { width: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .9;
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(0,0,0,.3)), var(--c); }
  #g-player .no small { font-weight: 700; font-size: 20px; letter-spacing: .2em; opacity: .8; }
  #g-player .no b { font-weight: 800; font-size: 92px; }
  #g-player .bd { flex: 1; display: flex; flex-direction: column; background: var(--panelA); }
  #g-player .top { flex: 1; display: flex; align-items: center; gap: 16px; padding: 0 24px; }
  #g-player .nm { flex: 1; font-weight: 800; font-size: 54px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateX(-24px); transition: opacity .3s, transform .4s; }
  #g-player.on .nm { opacity: 1; transform: none; transition-delay: .25s; }
  #g-player .meta { text-align: right; font-weight: 700; font-size: 20px; letter-spacing: .12em; color: rgba(255,255,255,.7); text-transform: uppercase; line-height: 1.15; }
  #g-player .meta b { display: block; color: var(--accent); font-size: 22px; }
  #g-player .top img { height: 56px; max-width: 80px; object-fit: contain; }
  #g-player .st { display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; background: rgba(0,0,0,.32); }
  #g-player .st div { display: flex; align-items: baseline; justify-content: center; gap: 10px; border-left: 1px solid rgba(255,255,255,.08);
    opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .3s; }
  #g-player.on .st div { opacity: 1; transform: none; transition-delay: calc(var(--i) * 60ms + .35s); }
  #g-player .st b { font-weight: 800; font-size: 40px; } #g-player .st span { font-weight: 700; font-size: 17px; letter-spacing: .14em; color: rgba(255,255,255,.65); }
  #g-player .st .warn b { color: #ff5a5a; }
  #g-player .acc { width: 8px; background: var(--accent); }

  /* ===== modo CENTRO (dentro de la pantalla del centro del scoreboard): colores del scoreboard y gráfico centrado ===== */
  html.center #bug { display: none; }
  /* lienzo de 1000 px de ancho con la forma de la caja del centro; cada gráfico la llena completa (como pantalla completa) */
  html.center .g { left: 0 !important; top: 0 !important; bottom: auto !important; width: 100% !important; height: 100% !important; display: flex; flex-direction: column; }
  /* Líderes, Marcador por cuartos y Comparativa: se despliegan desde arriba y se recogen hacia arriba */
  html.center #g-compare, html.center #g-leaders, html.center #g-lines { opacity: 1; transform: none; clip-path: inset(0 0 100% 0); transition: clip-path .45s cubic-bezier(.6,0,.4,1); }
  html.center #g-compare.on, html.center #g-leaders.on, html.center #g-lines.on { clip-path: inset(0 0 0 0); transition: clip-path .75s cubic-bezier(.2,.85,.25,1); }
  html.center .gt { flex: 0 0 auto; height: 70px; font-size: 40px; }
  html.center .gt small { font-size: 22px; }
  html.center .teamsRow { flex: 0 0 auto; height: 74px; grid-template-columns: 1fr 230px 1fr; }
  html.center .teamsRow > div { font-size: 40px; }
  html.center .row { flex: 1 1 0; height: auto !important; grid-template-columns: 1fr 230px 1fr; }
  html.center .row .lab { font-size: 22px; }
  html.center .side .v { font-size: 40px; }
  html.center .side .who { font-size: 34px; }
  html.center #g-leaders .side .v { font-size: 64px; }
  html.center .foot { flex: 0 0 8px; height: 8px; }
  html.center #g-lines table { flex: 1; width: 100%; }
  html.center #g-lines tr.row { display: table-row !important; }
  html.center #g-lines th { height: 46px; font-size: 22px; }
  html.center #g-lines td { font-size: 64px; height: auto; }
  html.center #g-lines td.tn { width: 30%; font-size: 52px; }
  html.center #g-lines td.tot { font-size: 72px; }
  /* Ficha de jugador a pantalla completa (estilo de la ficha del bateador): entra desde la derecha y sale hacia la izquierda */
  html.center #g-player { display: block; clip-path: none; filter: none; background: linear-gradient(135deg, var(--chead) 0%, var(--panel) 100%);
    opacity: 0; transform: translateX(4%); transition: opacity .38s ease, transform .38s cubic-bezier(.4,0,.8,.4); }
  html.center #g-player.on { opacity: 1; transform: none; transition: opacity .56s ease, transform .56s cubic-bezier(.2,.7,.2,1); }
  html.center.clear #g-player { background: transparent; }
  .pf { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .pf::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 50px 50px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 60%); mask-image: linear-gradient(90deg, transparent 0%, #000 60%); }
  .pf-head { position: relative; display: flex; justify-content: space-between; gap: 20px; padding: 24px 34px 0; font-weight: 800; font-size: 30px; letter-spacing: .15em; color: var(--accent); white-space: nowrap; text-transform: uppercase; }
  .pf-main { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 34px; align-items: center; padding: 0 34px; }
  .pf-big { font-weight: 800; font-style: italic; font-size: 300px; line-height: .85; color: transparent; -webkit-text-stroke: 5px rgba(255,255,255,.9); min-width: 210px; text-align: center; }
  .pf-id { display: grid; gap: 18px; min-width: 0; }
  .pf-row { display: flex; align-items: center; gap: 22px; min-width: 0; }
  .pf-num { font-weight: 800; font-style: italic; font-size: 110px; line-height: .9; color: var(--accent); }
  .pf-bar { width: 7px; align-self: stretch; background: var(--text); }
  .pf-names { min-width: 0; }
  .pf-first { font-weight: 700; font-size: 40px; letter-spacing: .06em; text-transform: uppercase; }
  .pf-last { font-weight: 800; font-style: italic; font-size: 96px; line-height: .95; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf-last.long { font-size: 70px; }
  .pf-facts { display: flex; gap: 34px; flex-wrap: wrap; }
  .pf-grp { display: grid; gap: 4px; }
  .pf-grp + .pf-grp { padding-left: 34px; border-left: 4px solid rgba(255,255,255,.35); }
  .pf-grp .gl { font-weight: 800; font-size: 20px; letter-spacing: .16em; color: var(--accent); }
  .pf-gs { display: flex; gap: 30px; }
  .pf-gs span { display: block; font-weight: 800; font-size: 20px; letter-spacing: .12em; color: var(--clabel); }
  .pf-gs b { font-weight: 800; font-size: 60px; line-height: 1.05; }
  .pf-gs .warn b { color: #ff5a5a; }
  .pf-slots { position: relative; display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 8px; padding: 0 16px 16px; }
  .pf-slot { background: rgba(255,255,255,.1); display: grid; justify-items: center; padding: 8px 0 10px; gap: 2px; }
  .pf-slot span { font-weight: 700; font-size: 20px; letter-spacing: .12em; color: var(--clabel); }
  .pf-slot b { font-weight: 800; font-size: 44px; }
  .pf-slot.cur { background: var(--accent); } .pf-slot.cur span, .pf-slot.cur b { color: var(--ink); }
  .pf-slot.fut b { color: rgba(255,255,255,.25); }
  html.center .gt { background: var(--chead); color: var(--text); }
  html.center .gt small { color: var(--text); opacity: .8; }
  html.center .row { border-top-color: var(--cline); }
  html.center .row .lab, html.center #g-lines th, html.center #g-player .meta, html.center #g-player .st span, html.center #g-player .no small { color: var(--clabel); }
  html.center .side .v small { color: var(--clabel); opacity: 1; }
  html.center .teamsRow .mid { background: var(--panel); color: var(--clabel); }
  html.center .foot { background: var(--cline); }
  html.center #g-player .acc { background: var(--cline); }
  html.center #g-player .no, html.center .teamsRow > div:not(.mid), html.center #g-lines td.tn { background: linear-gradient(rgba(255,255,255,.06), rgba(0,0,0,.3)), var(--home); }
  html.center.clear .teamsRow > div:not(.mid), html.center.clear #g-lines td.tn, html.center.clear #g-player .no { background: transparent; }
  html.center .shell, html.center #g-player { box-shadow: none; filter: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bug">
    <div class="in">
      <div class="brand"><small>ADSCREEN</small><b>SPORTS</b></div>
      <div class="tm home" id="b-home"><div class="poss"></div><div class="lg"></div><div class="nm"></div><div class="sub"><span class="pips"></span><span class="bon">BONUS</span><span class="fl"></span></div><div class="sc"><span></span></div></div>
      <div class="tm away" id="b-away"><div class="poss"></div><div class="lg"></div><div class="nm"></div><div class="sub"><span class="pips"></span><span class="bon">BONUS</span><span class="fl"></span></div><div class="sc"><span></span></div></div>
      <div class="gm"><div class="per" id="b-per"></div><div class="clk num" id="b-clk"></div><div class="sh num" id="b-sh"></div></div>
      <div class="alert" id="b-alert"><span class="l"></span><span class="t num"></span></div>
    </div>
  </div>
  <div id="gfx">
    <div class="g" id="g-player"></div>
    <div class="g shell" id="g-compare"></div>
    <div class="g shell" id="g-leaders"></div>
    <div class="g shell" id="g-lines"></div>
  </div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.get('preview') === '1';                 // Preview (preparado) o Program (al aire)
const FROM_OVERLAY = Q.get('from') === 'overlay';
// ?center=1: dentro de la pantalla del centro del scoreboard (display.html). Recibe el estado del display (sin conexión propia),
// muestra el gráfico que escogieron en "Vista del centro" y usa los colores del scoreboard (los de Líderes / Comparativa).
const CENTER = Q.get('center') === '1';
if (CENTER) document.documentElement.classList.add('center');
const $ = (id) => document.getElementById(id);

// ---------- escala: diseño 1920×1080 dentro de cualquier tamaño de ventana ----------
function fit() {

}

// ---------- configuración (colores, posición, tamaño, datos visibles) ----------

  for (const [k, f] of [['noLogos', 'showLogos'], ['noFouls', 'showFouls'], ['noBonus', 'showBonus'], ['noPoss', 'showPoss'], ['noShot', 'showShot'], ['noTO', 'showTO'], ['noBrand', 'showBrand']]) st.toggle(k, !c[f]);

function fmtGame(ms) {
  if (ms < 60000) return (Math.floor(ms / 100) / 10).toFixed(1);       // 59.9 ... 0.0
  const s = Math.ceil(ms / 1000);

}
// dibuja los relojes con lo último que mandó el servidor (mismo cálculo que el display de la cancha)
function tick() {
  if (S) {
    const el = performance.now() - clk.at;
    const g = Math.max(0, clk.g - (clk.gr ? el : 0)), s = Math.max(0, clk.s - (clk.sr ? el : 0)), tm = Math.max(0, clk.tm - (clk.tr ? el : 0));

    const sh = $('b-sh');
    txt(sh, show ? (s < 5000 && s > 0 ? (Math.floor(s / 100) / 10).toFixed(1) : Math.ceil(s / 1000)) : '');
    cls(sh, 'off', !show); cls(sh, 'low', show && s <= 5000);

    const T = S.timer && S.timer.kind ? S.timer : null, al = $('b-alert');

}
requestAnimationFrame(tick);

// ---------- datos de los gráficos ----------

    fgm: (st.p2m || 0) + (st.p3m || 0), fga: (st.p2a || 0) + (st.p3a || 0), tpm: st.p3m || 0, tpa: st.p3a || 0, ftm: st.ftm || 0, fta: st.fta || 0 };
}
const teamName = (t) => (S.settings.bcast.names ? t.name : t.short || t.name);
const teamsRow = (mid) => {

};
// cada gráfico: build() arma la estructura (una vez), vals() da los valores que se actualizan en su lugar
const nPer = () => Math.max(4, S.period, S.periodScores.home.length, S.periodScores.away.length);
const GFX = {
  compare: {
    key: () => S.teams.home.logo + S.teams.away.logo,

      [['Tiros de campo', 'fg'], ['Triples', 'tp'], ['Tiros libres', 'ft'], ['Rebotes', 'reb'], ['Asistencias', 'ast'], ['Robos', 'stl'], ['Pérdidas', 'tov'], ['Tapones', 'blk']]
        .map(([l, k], i) => `<div class="row" style="--i:${i}"><div class="side h"><span class="bar" data-w="h${k}"></span><span class="v" data-v="h${k}"></span></div><div class="lab">${l}</div><div class="side a"><span class="bar" data-w="a${k}"></span><span class="v" data-v="a${k}"></span></div></div>`).join('') +
      '<div class="foot"></div>',
    vals() {
      const h = totals(S.teams.home), a = totals(S.teams.away), V = { hn: teamName(S.teams.home), an: teamName(S.teams.away) }, W = {}, L = {};
      const share = (x, y) => (x + y > 0 ? [x / (x + y), y / (x + y)] : [0, 0]);
      for (const [k, m, at] of [['fg', 'fgm', 'fga'], ['tp', 'tpm', 'tpa'], ['ft', 'ftm', 'fta']]) {
        const hp = h[at] ? h[m] / h[at] : 0, ap = a[at] ? a[m] / a[at] : 0;
        V['h' + k] = { html: `${h[at] ? Math.round(hp * 100) + '%' : '--'}<small>${h[m]}/${h[at]}</small>` };
        V['a' + k] = { html: `${a[at] ? Math.round(ap * 100) + '%' : '--'}<small>${a[m]}/${a[at]}</small>` };
        [W['h' + k], W['a' + k]] = share(hp, ap); L['h' + k] = hp > ap; L['a' + k] = ap > hp;
      }
      for (const k of ['reb', 'ast', 'stl', 'tov', 'blk']) {
        V['h' + k] = h[k]; V['a' + k] = a[k]; [W['h' + k], W['a' + k]] = share(h[k], a[k]);
        const lower = k === 'tov'; L['h' + k] = h[k] !== a[k] && (h[k] > a[k]) !== lower; L['a' + k] = h[k] !== a[k] && (a[k] > h[k]) !== lower;
      }
      return { V, W, L };
    },
  },
  leaders: {
    key: () => S.teams.home.logo + S.teams.away.logo,
    build: () => `<div class="gt">LÍDERES <small>DEL PARTIDO</small></div>${teamsRow('')}` +
      [['Puntos', 'pts'], ['Rebotes', 'reb'], ['Asistencias', 'ast']]
        .map(([l, k], i) => `<div class="row" style="--i:${i};height:62px"><div class="side h"><span class="v" data-v="h${k}"></span><span class="who" data-v="hw${k}"></span></div><div class="lab">${l}</div><div class="side a"><span class="v" data-v="a${k}"></span><span class="who" data-v="aw${k}"></span></div></div>`).join('') +

  lines: {
    key: () => Math.max(4, S.period, S.periodScores.home.length, S.periodScores.away.length) + S.teams.home.logo + S.teams.away.logo,
    build() {

      const row = (s, k, i) => `<tr class="row" style="--i:${i};display:table-row"><td class="tn" style="--c:var(--${k})" data-v="${s}n"></td>${Array.from({ length: n }, (_, j) => `<td data-v="${s}${j}"></td>`).join('')}<td class="tot" data-v="${s}t"></td></tr>`;

      const n = Math.max(4, S.period, S.periodScores.home.length, S.periodScores.away.length);
      for (const [s, k] of [['h', 'home'], ['a', 'away']]) for (let j = 0; j < n; j++) {

  },
  player: {
    key: (lv) => lv.team + ':' + lv.idx + ':' + (S.teams[lv.team].logo || '') + (CENTER ? ':' + nPer() : ''),
    build: (lv) => {
      const t = S.teams[lv.team];
      if (CENTER) {
        const n = nPer(), lab = (i) => (i < 4 ? 'Q' + (i + 1) : i === 4 ? 'OT' : (i - 3) + 'OT');
        return `<div class="pf"><div class="pf-head"><span data-v="head"></span><span data-v="posl"></span></div>
          <div class="pf-main"><div class="pf-big" data-v="n"></div><div class="pf-id">
            <div class="pf-row"><span class="pf-num" data-v="n2"></span><span class="pf-bar"></span><div class="pf-names"><div class="pf-first" data-v="first"></div><div class="pf-last" data-v="last"></div></div></div>
            <div class="pf-facts"><div class="pf-grp"><div class="gl">EN EL JUEGO</div><div class="pf-gs">${[['PTS', 'pts'], ['REB', 'reb'], ['AST', 'ast'], ['FALTAS', 'pf']].map(([l, k]) => `<div data-c="${k}"><span>${l}</span><b data-v="${k}"></b></div>`).join('')}</div></div>
              <div class="pf-grp"><div class="gl">DEL EQUIPO</div><div class="pf-gs"><div><span>% PUNTOS</span><b data-v="share"></b></div></div></div></div>
          </div></div>
          <div class="pf-slots" style="--n:${n}">${Array.from({ length: n }, (_, j) => `<div class="pf-slot" data-s="${j}"><span>${lab(j)}</span><b data-v="q${j}"></b></div>`).join('')}</div></div>`;
      }
      return `<div class="no" style="--c:var(--${lv.team})"><small>NÚMERO</small><b data-v="n"></b></div><div class="acc"></div>
        <div class="bd"><div class="top"><div class="nm" data-v="nm"></div><div class="meta"><b data-v="pos"></b><span data-v="tn"></span></div>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}</div>
        <div class="st">${[['PTS', 'pts'], ['REB', 'reb'], ['AST', 'ast'], ['FALTAS', 'pf']].map(([l, k], i) => `<div style="--i:${i}" data-c="${k}"><b data-v="${k}"></b><span>${l}</span></div>`).join('')}</div></div>`;
    },

      const extra = {};

        const parts = String(p.name || 'Jugador').trim().split(/\s+/), first = parts.length > 1 ? parts[0] : '', last = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];
        Object.assign(V, { n2: p.n || '', first, last, head: 'Jugador · ' + t.name, posl: p.pos ? 'Posición ' + p.pos : '',
          share: t.score ? Math.round((p.pts || 0) / t.score * 100) + '%' : '0%' });
        const sc = S.periodScores[lv.team] || [];
        for (let j = 0; j < nPer(); j++) V['q' + j] = j < S.period ? (sc[j] ?? 0) : '–';

// actualiza en su lugar (texto, barras, líder): nunca se rehace el gráfico mientras está al aire → sin repetir animaciones
function fill(el, g, lv) {
  const d = GFX[g].vals(lv);
  el.querySelectorAll('[data-v]').forEach((x) => {
    const v = d.V[x.dataset.v]; if (v === undefined) return;
    if (v && typeof v === 'object') { if (x.innerHTML !== v.html) x.innerHTML = v.html; } else txt(x, v);
    if (x.classList.contains('v')) cls(x, 'lead', !!d.L[x.dataset.v]);
    if (d.F) cls(x, 'fut', !!d.F[x.dataset.v]);
  });
  el.querySelectorAll('[data-w]').forEach((x) => { const w = Math.round((d.W[x.dataset.w] || 0) * 100) + '%'; if (x.style.width !== w) x.style.width = w; });
  if (d.warn) el.querySelectorAll('[data-c]').forEach((x) => cls(x, 'warn', !!d.warn[x.dataset.c]));
  if (d.slots) el.querySelectorAll('[data-s]').forEach((x) => { const j = +x.dataset.s; cls(x, 'cur', j === S.period - 1 && !S.final); cls(x, 'fut', j >= S.period); });
  if (d.long !== undefined) { const l = el.querySelector('.pf-last'); if (l) cls(l, 'long', d.long); }
}

// ---------- qué gráfico se ve: sale el anterior (su animación de salida) y entra el nuevo ----------
const OUT_MS = 450;
let cur = { key: '', g: '', lv: null }, swapT = null, builtKey = {};
fit();
// modo centro: el gráfico se centra y se agranda para llenar la caja del centro
function centerFit() {
  const dw = 1000, dh = Math.max(300, Math.round(dw * innerHeight / Math.max(1, innerWidth))), k = innerWidth / dw, st = $('stage').style;
  const W = dw + 'px', H = dh + 'px', tr = `scale(${k})`;
  if (st.width !== W) st.width = W; if (st.height !== H) st.height = H; if (st.transform !== tr) st.transform = tr;
}
// colores del scoreboard: los mismos de Líderes / Comparativa (incluido "Mismo color del fondo", que se calcula en el display)
let colKey = '';
function centerColors() {
  let R, cs; try { R = parent.document.documentElement; cs = getComputedStyle(R); } catch (_) { return; }
  const v = (n, d) => cs.getPropertyValue(n).trim() || d, clear = R.classList.contains('vclear');
  const c = { panel: v('--vbg', '#050a24'), head: v('--vhead', '#0a2fb8'), teams: v('--vteams', '#0a2fb8'), line: v('--vline', '#1b4bff'),
    label: v('--vlabel', '#9db4ff'), lead: v('--vlead', '#ffd400'), text: v('--vtext', '#ffffff') };
  const key = JSON.stringify(c) + clear; if (key === colKey) return; colKey = key;
  const D = document.documentElement.style;
  D.setProperty('--panel', clear ? 'transparent' : c.panel); D.setProperty('--panelA', clear ? 'transparent' : c.panel);
  D.setProperty('--chead', clear ? 'transparent' : c.head); D.setProperty('--home', c.teams); D.setProperty('--away', c.teams);
  D.setProperty('--cline', c.line); D.setProperty('--clabel', c.label); D.setProperty('--accent', c.lead); D.setProperty('--text', c.text);
  document.documentElement.classList.toggle('clear', clear);
}
if (CENTER) setInterval(centerColors, 1000);               // el color automático del fondo puede cambiar después
function liveKey(lv) { return lv.g ? lv.g + (lv.g === 'player' ? ':' + lv.team + ':' + lv.idx : '') : ''; }
function syncGfx(lv) {
  const key = liveKey(lv);
  if (key === cur.key) {                                     // el mismo gráfico: solo se actualizan los datos
    if (cur.g) { const el = $('g-' + cur.g); maybeBuild(el, cur.g, lv); fill(el, cur.g, lv); if (CENTER) centerFit(el); }
    return;
  }
  clearTimeout(swapT);
  const prev = cur.g ? $('g-' + cur.g) : null, wasOn = prev && prev.classList.contains('on');
  if (prev) { prev.classList.remove('on'); prev.classList.add('out'); setTimeout(() => prev.classList.remove('out'), OUT_MS); }
  cur = { key, g: lv.g, lv: { ...lv } };
  if (!lv.g) return;
  swapT = setTimeout(() => {
    const el = $('g-' + lv.g);
    builtKey[lv.g] = null; maybeBuild(el, lv.g, lv); fill(el, lv.g, lv);   // se arma de nuevo al entrar
    if (CENTER) centerFit(el);
    void el.offsetWidth;                                     // asegura que la entrada se anime desde el estado oculto
    el.classList.remove('out'); el.classList.add('on');
  }, wasOn ? OUT_MS : 0);
}
function maybeBuild(el, g, lv) {
  const k = 'k:' + GFX[g].key(lv);                         // nunca vacía (equipos sin logo)
  if (builtKey[g] === k) return;
  builtKey[g] = k; el.innerHTML = GFX[g].build(lv);
}

const CENTER_G = { 'pro-player': 'player', 'pro-compare': 'compare', 'pro-leaders': 'leaders', 'pro-lines': 'lines' };
function render() {
  if (CENTER) {
    centerColors();
    const set = S.settings;
    syncGfx({ bug: false, g: CENTER_G[set.centerView] || '', team: set.centerTeam === 'away' ? 'away' : 'home', idx: Math.max(0, Math.min(11, set.centerIdx | 0)) });
    return;
  }
  const c = S.settings.bcast; applyCfg(c);
  const lv = S.bcast[PREVIEW ? 'pvw' : 'pgm'];
  renderBug();
  cls($('bug'), 'on', !!lv.bug);
  syncGfx(lv);
  if (FROM_OVERLAY) {                                        // vino del /overlay: si cambian el estilo, regresa al overlay normal
    const ov = (S.settings.screens || []).find((x) => x.id === 'overlay');
    if (ov && ov.bugStyle !== 'pro') location.replace('/display.html?p=overlay');
  }
}

// ---------- WebSocket: reconexión automática; al volver, el servidor manda el estado completo ----------
let wait = 500;
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => { wait = 500; };
  ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onMsg(m); };
  ws.onclose = () => {
    // sin conexión: los relojes se congelan donde iban (no se inventa tiempo) hasta que vuelva el estado real
    const el = performance.now() - clk.at;
    clk = { g: Math.max(0, clk.g - (clk.gr ? el : 0)), s: Math.max(0, clk.s - (clk.sr ? el : 0)), tm: Math.max(0, clk.tm - (clk.tr ? el : 0)), gr: false, sr: false, tr: false, at: performance.now() };
    setTimeout(connect, wait); wait = Math.min(5000, wait * 2);
  };
}
function onMsg(m) {
    if (m.t === 'state') {
      S = m.s; label = m.label;
      clk = { g: S.game.ms, s: S.shot.ms, gr: S.game.running, sr: S.shot.running, tm: S.timer.ms, tr: S.timer.running, at: performance.now() };
      if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(render); else render();
    } else if (m.t === 'clock') {
      clk = { g: m.g, s: m.s, gr: m.gr, sr: m.sr, tm: m.tm, tr: m.tr, at: performance.now() };
    }
}
if (CENTER) {
  // el display de la cancha le pasa el estado: mismos datos, sin otra conexión
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.t) onMsg(e.data); });
  if (parent !== window) parent.postMessage({ t: 'centerReady' }, location.origin);
} else connect();
</script>
